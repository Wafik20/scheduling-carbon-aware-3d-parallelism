name: conda_env
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib-base
  - ipykernel
  - pip
  - pip:
      - -e .
      - nvidia-ml-py
      - requests
      - python-dotenv

# PyTorch, Megatron-LM, and container images are cluster-specific for the
# full GPU pretraining launchers. See docs/reproducing_experiments.md.
