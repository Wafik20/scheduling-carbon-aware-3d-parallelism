name: gpu_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # PyTorch with CUDA 11.8
  - pytorch

  # Data analysis (no GUI/Qt dependencies)
  - numpy
  - pandas

  # Lightweight plotting (no Qt)
  - matplotlib-base      # base only, excludes Qt backend

  - pip:
    - nvidia-ml-py             # power monitoring
    - cupy-cuda11x       # GPU compute
    - --no-build-isolation megatron-core  # MegatronLM core
    - nltk